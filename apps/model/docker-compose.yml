services:
  model:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./weights:/app/weights:ro
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
