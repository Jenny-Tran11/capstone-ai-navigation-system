name: Deploy

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-setup
        with:
          production_aws_role_arn: ${{ secrets.PRODUCTION_AWS_ROLE_ARN }}
          staging_aws_role_arn: ${{ secrets.STAGING_AWS_ROLE_ARN }}
          configure_aws: 'false'

      - name: Build API
        run: pnpm --filter @baseline/api run build

  deploy-admin-web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin
            filter: '@baseline/admin'
            artifact: admin-dist
            dist: apps/admin/.dist
          - name: web
            filter: '@baseline/web'
            artifact: web-dist
            dist: apps/web/.dist
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-setup
        with:
          production_aws_role_arn: ${{ secrets.PRODUCTION_AWS_ROLE_ARN }}
          staging_aws_role_arn: ${{ secrets.STAGING_AWS_ROLE_ARN }}
          # Needed so generate:env:* can call CloudFormation (same as local SSO default chain).
          configure_aws: 'true'

      - name: Generate env & build ${{ matrix.name }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            pnpm run generate:env:prod
          else
            pnpm run generate:env:staging
          fi
          pnpm --filter ${{ matrix.filter }} run build:deploy

      - name: Upload ${{ matrix.name }} bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist }}
          # Vite outDir is `.dist` (hidden); upload-artifact skips hidden paths by default
          include-hidden-files: true
          if-no-files-found: error

  deploy-infra:
    needs: [deploy-api, deploy-admin-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ci-setup
        with:
          production_aws_role_arn: ${{ secrets.PRODUCTION_AWS_ROLE_ARN }}
          staging_aws_role_arn: ${{ secrets.STAGING_AWS_ROLE_ARN }}

      - name: Download admin bundle
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: apps/admin/.dist

      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/.dist

      - name: Deploy infrastructure (CDK)
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            pnpm --filter @baseline/infra run deploy:staging
          elif [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            pnpm --filter @baseline/infra run deploy:prod
          fi
