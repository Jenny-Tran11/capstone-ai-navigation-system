name: CI setup
description: Project env, pnpm, cache, install, and AWS OIDC (run actions/checkout before this local composite)

inputs:
  production_aws_role_arn:
    description: IAM role ARN for OIDC when ref is refs/heads/prod
    required: true
  staging_aws_role_arn:
    description: IAM role ARN for OIDC for all other refs
    required: true
  configure_aws:
    description: Assume IAM role and configure AWS CLI (skip for build-only jobs)
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Project variables
      shell: bash
      run: ./scripts/project-variables-github.sh

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Get pnpm store directory
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

    - uses: actions/cache@v4
      name: Setup pnpm cache
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      run: pnpm install

    - name: Select AWS OIDC role
      if: inputs.configure_aws == 'true'
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
          echo "ROLE_ARN=${{ inputs.production_aws_role_arn }}" >> "$GITHUB_ENV"
        else
          echo "ROLE_ARN=${{ inputs.staging_aws_role_arn }}" >> "$GITHUB_ENV"
        fi

    - name: Configure AWS credentials (OIDC)
      if: inputs.configure_aws == 'true'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ env.ROLE_ARN }}
        output-credentials: true

    - name: Verify AWS credentials (OIDC env chain)
      if: inputs.configure_aws == 'true'
      shell: bash
      run: |
        unset AWS_PROFILE
        aws sts get-caller-identity --query "Account" --output text
        echo "AWS_PROFILE=" >> "$GITHUB_ENV"
