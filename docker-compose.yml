services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ministack-state:/tmp/ministack-state
    environment:
      - PERSIST_STATE=1
      - LAMBDA_EXECUTOR=docker

volumes:
  ministack-state:
